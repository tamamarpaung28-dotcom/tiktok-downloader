<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TikTok Downloader</title>
    <!-- Font Sans-Serif Minimalis & Clean -->
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg-main: #0c0d10;
        --card-bg: rgba(20, 22, 28, 0.85);
        --accent-color: #e11d48;
        --accent-hover: #be123c;
        --text-primary: #f3f4f6;
        --text-secondary: #9ca3af;
        --border-color: rgba(255, 255, 255, 0.08);
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family:
          "Plus Jakarta Sans",
          -apple-system,
          BlinkMacSystemFont,
          sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background: var(--bg-main);
        background-image:
          radial-gradient(
            ellipse at 50% 0%,
            rgba(225, 29, 72, 0.08) 0%,
            transparent 60%
          ),
          radial-gradient(
            ellipse at 50% 100%,
            rgba(15, 23, 42, 0.6) 0%,
            transparent 80%
          );
        color: var(--text-primary);
        padding: 20px;
      }

      .card {
        background: var(--card-bg);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid var(--border-color);
        border-radius: 20px;
        padding: 36px 30px;
        width: 100%;
        max-width: 420px;
        text-align: center;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      }

      .badge {
        display: inline-block;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.5px;
        color: var(--text-secondary);
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid var(--border-color);
        padding: 5px 14px;
        border-radius: 20px;
        margin-bottom: 16px;
      }

      h2 {
        font-size: 22px;
        font-weight: 700;
        letter-spacing: -0.5px;
        color: var(--text-primary);
        margin-bottom: 6px;
      }

      .subtitle {
        color: var(--text-secondary);
        font-size: 13px;
        margin-bottom: 28px;
        font-weight: 400;
      }

      .input-group {
        margin-bottom: 16px;
      }

      input[type="text"] {
        width: 100%;
        padding: 14px 16px;
        background: rgba(12, 13, 16, 0.7);
        border: 1px solid var(--border-color);
        color: var(--text-primary);
        border-radius: 12px;
        font-size: 14px;
        font-family: inherit;
        outline: none;
        transition:
          border-color 0.2s ease,
          background 0.2s ease;
      }

      input[type="text"]::placeholder {
        color: #4b5563;
      }

      input[type="text"]:focus {
        border-color: rgba(255, 255, 255, 0.25);
        background: rgba(12, 13, 16, 0.95);
      }

      /* Minimalist Radio Option */
      .option-group {
        display: flex;
        gap: 10px;
        margin-bottom: 20px;
        justify-content: center;
        background: rgba(12, 13, 16, 0.5);
        padding: 5px;
        border-radius: 12px;
        border: 1px solid var(--border-color);
      }

      .option-group label {
        flex: 1;
        cursor: pointer;
        padding: 9px 12px;
        font-size: 13px;
        font-weight: 500;
        color: var(--text-secondary);
        border-radius: 8px;
        transition: all 0.2s ease;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }

      .option-group input[type="radio"] {
        accent-color: var(--accent-color);
      }

      /* Clean Button */
      .btn-process {
        width: 100%;
        padding: 14px;
        background: var(--accent-color);
        color: #ffffff;
        border: none;
        border-radius: 12px;
        font-size: 14px;
        font-weight: 600;
        font-family: inherit;
        cursor: pointer;
        transition:
          background 0.2s ease,
          transform 0.1s ease;
      }

      .btn-process:hover {
        background: var(--accent-hover);
      }

      .btn-process:active {
        transform: scale(0.99);
      }

      .btn-process:disabled {
        opacity: 0.5;
        cursor: not-allowed;
        transform: none;
      }

      /* Result Section */
      #result {
        margin-top: 24px;
        padding-top: 20px;
        border-top: 1px solid var(--border-color);
        display: none;
        animation: fadeIn 0.3s ease;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .thumb-wrapper {
        border-radius: 12px;
        overflow: hidden;
        border: 1px solid var(--border-color);
        margin-bottom: 14px;
        background: #000;
      }

      img {
        width: 100%;
        max-height: 240px;
        object-fit: cover;
        display: block;
      }

      h4 {
        font-size: 13px;
        font-weight: 500;
        color: var(--text-secondary);
        margin-bottom: 16px;
        line-height: 1.5;
        display: -webkit-box;
        line-clamp: 2;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
        text-align: left;
      }

      .download-btn {
        display: block;
        width: 100%;
        padding: 14px 0;
        background: #ffffff;
        color: #0c0d10;
        text-decoration: none;
        border-radius: 12px;
        font-size: 14px;
        font-weight: 600;
        transition:
          background 0.2s ease,
          transform 0.1s ease;
      }

      .download-btn:hover {
        background: #e5e7eb;
      }

      .download-btn:active {
        transform: scale(0.99);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="badge">TikTok Downloader</div>
      <h2>Media Extractor by tama ganteng</h2>
      <p class="subtitle">Unduh video tanpa watermark & audio MP3</p>

      <div class="input-group">
        <input
          type="text"
          id="videoUrl"
          placeholder="Tempelkan link TikTok di sini..."
          autocomplete="off"
        />
      </div>

      <div class="option-group">
        <label
          ><input type="radio" name="format" value="video" checked /> Video
          (MP4)</label
        >
        <label
          ><input type="radio" name="format" value="audio" /> Audio (MP3)</label
        >
      </div>

      <button onclick="processLink()" id="btnSubmit" class="btn-process">
        Ambil Media
      </button>

      <div id="result">
        <div class="thumb-wrapper">
          <img id="thumb" src="" alt="Thumbnail" />
        </div>
        <h4 id="title"></h4>
        <a id="dlLink" class="download-btn" target="_blank" rel="noreferrer"
          >Download File</a
        >
      </div>
    </div>

    <script>
      async function processLink() {
        const urlInput = document.getElementById("videoUrl").value.trim();
        const formatType = document.querySelector(
          'input[name="format"]:checked',
        ).value;
        const btn = document.getElementById("btnSubmit");
        const resultDiv = document.getElementById("result");

        if (!urlInput) {
          alert("Silakan masukkan link TikTok terlebih dahulu.");
          return;
        }

        btn.innerText = "Memproses...";
        btn.disabled = true;
        resultDiv.style.display = "none";

        // URL Backend Railway
        const BACKEND_URL = "https://tiktok-downloader-production-b5f8.up.railway.app/api/info";

        try {
          // Gantilah URL di fetch menjadi mengarah ke /info
const response = await fetch("https://tiktok-downloader-production-b5f8.up.railway.app/info", {
  method: "POST",
  headers: { 
    "Content-Type": "application/json" 
  },
  body: JSON.stringify({
    url: urlInput,
    format_type: formatType,
  }),
});

          const data = await response.json();

          if (response.ok) {
            document.getElementById("thumb").src = data.thumbnail || "";
            document.getElementById("title").innerText = data.title || "Tanpa Judul";
            document.getElementById("dlLink").href = data.download_url;

            if (data.type === "audio" || formatType === "audio") {
              document.getElementById("dlLink").innerText = "Download MP3 Audio";
            } else {
              document.getElementById("dlLink").innerText = "Download MP4 Video";
            }

            resultDiv.style.display = "block";
          } else {
            alert(data.detail || data.message || "Gagal memproses link TikTok.");
          }
        } catch (error) {
          console.error("Fetch Error:", error);
          alert(
            "Gagal terhubung ke Railway! Pastikan Backend di Railway sudah aktif & CORS sudah diizinkan di main.py."
          );
        } finally {
          btn.innerText = "Ambil Media";
          btn.disabled = false;
        }
      }
    </script>
  </body>
</html>
